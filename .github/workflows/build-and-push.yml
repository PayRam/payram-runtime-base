name: Build and push runtime base image

on:
  push:
    tags:
      - "v*"          # fires on tag pushes like v1.0.0, v1.1.0, v2.0.0
  workflow_dispatch:  # allow manual runs from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag names
        id: tags
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"       # e.g. v1.0.0
          MAJOR="${VERSION%%.*}"             # e.g. v1
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/payram/runtime-base:${{ steps.tags.outputs.version }}
            ghcr.io/payram/runtime-base:${{ steps.tags.outputs.major }}
            ghcr.io/payram/runtime-base:latest
          labels: |
            org.opencontainers.image.source=https://github.com/PayRam/payram-runtime-base
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
